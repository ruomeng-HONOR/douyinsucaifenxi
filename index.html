<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="抖音与淘宝短视频素材的本地独立分析系统">
  <title>双平台视频素材分析系统</title>
  <link rel="stylesheet" href="./styles.css?v=20260728-1">
</head>
<body>
  <section id="system-home" class="system-home">
    <div class="home-shell">
      <div class="home-brand">
        <div class="eyebrow">VIDEO MATERIAL INTELLIGENCE</div>
        <h1>双平台视频素材分析系统</h1>
        <p>抖音与淘宝使用独立的数据空间、筛选条件、评分模型和经营看板。</p>
      </div>
      <div class="system-cards">
        <button type="button" class="system-card douyin" data-enter-system="douyin">
          <span class="system-icon">抖</span>
          <small>DOUYIN WORKSPACE</small>
          <strong>抖音视频素材分析</strong>
          <p>适配千川推商品、推直播报表，聚焦净ROI、退款质量和视频留存。</p>
          <i>进入抖音系统 →</i>
        </button>
        <button type="button" class="system-card taobao" data-enter-system="taobao">
          <span class="system-icon">淘</span>
          <small>TAOBAO WORKSPACE</small>
          <strong>淘宝视频素材分析</strong>
          <p>适配万相台内容营销短视频报表，聚焦成交、有效观看、收藏加购和新客。</p>
          <i>进入淘宝系统 →</i>
        </button>
      </div>
      <div class="home-privacy">LOCAL ONLY · Excel 数据仅保存在当前浏览器，不上传服务器</div>
    </div>
  </section>

  <main id="system-workspace" class="app-shell" hidden>
    <header class="topbar">
      <div class="workspace-heading">
        <button id="back-home" class="back-button" type="button">← 返回系统首页</button>
        <div id="system-eyebrow" class="eyebrow"></div>
        <h1 id="system-title"></h1>
        <p id="system-description"></p>
      </div>
      <div class="header-actions">
        <label id="upload-label" class="upload-button" for="excel-file">＋ 上传 Excel</label>
        <input id="excel-file" class="sr-only" type="file" accept=".xlsx,.xls">
        <button id="clear-data" class="ghost-button" type="button">清空本系统数据</button>
      </div>
    </header>

    <div id="notice" class="notice" hidden></div>

    <section id="filters" class="filter-strip" hidden>
      <label id="mode-field">投放类型
        <select id="mode-filter"><option value="all">全部类型</option></select>
      </label>
      <label id="shop-field">店铺
        <select id="shop-filter"><option value="all">全部店铺</option></select>
      </label>
      <label><span id="account-label">账户/计划</span>
        <select id="account-filter"><option value="all">全部账户/计划</option></select>
      </label>
      <label><span id="material-label">素材ID</span>
        <select id="material-filter"><option value="all">全部素材</option></select>
      </label>
      <label>开始月份<input id="start-date" type="month"></label>
      <span class="date-arrow">→</span>
      <label>结束月份<input id="end-date" type="month"></label>
      <button id="reanalyze" class="secondary-button" type="button">重新分析</button>
      <div id="range-meta" class="range-meta"></div>
    </section>

    <section id="empty-state" class="empty-state">
      <div id="empty-mark" class="empty-mark">↑</div>
      <h2 id="empty-title"></h2>
      <p id="empty-copy"></p>
      <label class="upload-button" for="excel-file">选择 Excel 文件</label>
    </section>

    <div id="dashboard" hidden>
      <nav class="section-nav" aria-label="分析模块">
        <button type="button" data-tab="overview" class="active">经营总览</button>
        <button type="button" data-tab="materials">素材评分</button>
        <button type="button" data-tab="functional">功能画像</button>
        <button type="button" data-tab="actions">行动清单</button>
      </nav>
      <section id="view-overview" class="tab-view"></section>
      <section id="view-materials" class="tab-view" hidden></section>
      <section id="view-functional" class="tab-view" hidden></section>
      <section id="view-actions" class="tab-view" hidden></section>
    </div>
  </main>
  <script src="./xlsx.full.min.js"></script>
  <script type="module" src="./app.js?v=20260728-1"></script>
</body>
</html>
